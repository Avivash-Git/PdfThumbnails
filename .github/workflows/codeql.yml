# CodeQL code scanning for the C and C++ code: the thumbnail handler and the settings app.
# It builds the ci-x64 preset through scripts\build.cmd (configure and build only), so CodeQL
# sees every compiler call, and uploads the results to the repository's Security tab.
# Code scanning's "default setup" must stay off: it cannot run next to this workflow.

name: codeql

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
  schedule:
    - cron: "17 4 * * 1"   # Mondays, for new queries on unchanged code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: cmd

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ${{ vars.PDFT_WIN_X64_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      PDFT_ARCH: x64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same download cache as build.yml: pinned downloads (cmake/Pins.cmake), stored as
      # <sha256>-<name> and checked again on every use.
      - name: Restore the download cache
        id: downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: pdft-downloads-${{ env.PDFT_ARCH }}-${{ hashFiles('cmake/Pins.cmake') }}

      - name: Fetch PDFium and verify its attestation (new pins only)
        if: steps.downloads.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake -DARCH=%PDFT_ARCH% -DVERIFY_ATTESTATION=ON -P cmake/FetchPdfium.cmake

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build (scripts\build.cmd ci-x64-build)
        env:
          PDFT_VS_VERSION: ${{ vars.PDFT_VS_VERSION }}
        run: call scripts\build.cmd ci-x64-build || exit /b 1

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp
