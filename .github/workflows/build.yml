# Builds, tests and stages PdfThumbnails with MSVC through scripts\build.cmd, the same entry
# point as a local build (docs/BUILDING.md).
#
#   build (ci-x64)    x64 Release: gates, unit, handler and integration tests; artifacts
#   build (ci-arm64)  ARM64 Release, cross-compiled on the x64 runner: gates; artifacts
#   build (x64-debug) x64 Debug: gates, unit, handler and integration tests (not on pull
#                     requests, unless called by another workflow)
#   test-arm64        the ARM64 test bundle, run natively on an ARM64 runner (not on pull
#                     requests, unless called; also when another build leg failed)
#   system-x64        informational, never blocks: the x64 system tests (ctest label "system")
#                     from the x64 test bundle against the staged runtime artifact: the real
#                     install for all users through UAC, the commands that use it, 1.1's state
#                     replaced, the uninstall, and nothing left; the task tests and --setup-user
#                     as a standard account; the thumbnail refresh experiment's automatic part
#                     and the cache after the uninstall; then, on a runner GitHub hosts only,
#                     what the thumbnail-cache rebuild finds on the runner and the rebuild for
#                     real (not on pull requests, unless called)
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), all optional:
#   PDFT_WIN_X64_RUNNER  x64 runner label. Default windows-2025, which serves Visual Studio 2026
#                        (v145) and its own CMake 4.x, private repositories included.
#   PDFT_VS_VERSION      vswhere version range for scripts\build.cmd, e.g. [18.11,19.0); empty =
#                        the newest Visual Studio 18.11 or later on the image.
#   PDFT_ARM64_RUNNER    ARM64 runner label. Default windows-11-arm (windows-11-vs2026-arm works
#                        too: the job needs only CTest).
#   PDFT_ARM64_TESTS     "off" skips test-arm64, for when no ARM64 runner is available to the
#                        repository's plan.
#
# Artifacts are unsigned developer builds, not releases: PdfThumbnails-<arch>-unsigned (the
# runtime staging tree), symbols-<arch> (its PDBs), tests-<arch> (test bundle for test-arm64).
# Each carries BUILDINFO.txt (runner image, Visual Studio, cl, link, CMake and Ninja versions).

name: build

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "THIRD-PARTY-NOTICES.md"   # installed with the binaries and checked by gate.licenses
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "THIRD-PARTY-NOTICES.md"
  workflow_dispatch:
  workflow_call:   # for later release workflows (M3/M4)
    inputs:
      called:
        description: Leave at the default; it gives a called run a concurrency group of its own.
        type: boolean
        default: true

permissions: {}

concurrency:
  # In a called workflow github.workflow is the caller's name, so a called run gets its own
  # group; otherwise one group per pull request or branch.
  group: ${{ inputs.called && format('build-called-{0}', github.run_id) || format('build-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.called }}

defaults:
  run:
    shell: cmd

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ${{ vars.PDFT_WIN_X64_RUNNER || 'windows-2025' }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-x64, ci-arm64, x64-debug]
        exclude:
          # Pull requests build only what ships (Windows minutes are limited on a private repo).
          # A called run sees its caller's event name, so it checks inputs.called too.
          - preset: ${{ github.event_name == 'pull_request' && !inputs.called && 'x64-debug' || 'none' }}
    env:
      PRESET: ${{ matrix.preset }}
      PDFT_ARCH: ${{ contains(matrix.preset, 'arm64') && 'arm64' || 'x64' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned downloads (cmake/Pins.cmake), stored as <sha256>-<name>; every use re-checks the
      # SHA-256, so the cache cannot change what gets built.
      - name: Restore the download cache
        id: downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: pdft-downloads-${{ env.PDFT_ARCH }}-${{ hashFiles('cmake/Pins.cmake') }}

      - name: Fetch PDFium and verify its attestation (new pins only)
        if: steps.downloads.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake -DARCH=%PDFT_ARCH% -DVERIFY_ATTESTATION=ON -P cmake/FetchPdfium.cmake

      - name: Runner image, UAC and token
        run: |
          echo Runner image: %ImageOS% %ImageVersion%
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin
          whoami /groups | findstr /i /c:"Mandatory Label" /c:"S-1-5-32-544"
          exit /b 0

      - name: Configure, build and test (scripts\build.cmd)
        env:
          PDFT_VS_VERSION: ${{ vars.PDFT_VS_VERSION }}
        run: |
          set "PDFT_VERSION_SUFFIX=-ci+g%GITHUB_SHA:~0,8%"
          call scripts\build.cmd %PRESET% || exit /b 1

      # The runner is elevated (High integrity): the handler tests must have relaunched
      # themselves at Medium, the elevated-refusal test must have run, not skipped (its copy at
      # Medium with Administrators still enabled refused too), and gate.planting must have run the
      # executables' elevated-only command too (its own line,
      # "<exe> --status --no-live-test -> exit 0x...", which no other test prints). The task
      # tests that only an elevated runner can run (the protected task folder, a standard user's
      # task in it, another account's tasks at the user's task names, --checks refused elevated
      # and run at Medium where nothing is installed, the writing commands --setup-user,
      # --migrate-v1, --install and --uninstall refused elevated, --diagnostics without the log
      # and --diagnostics --out refused elevated, --setup-machine in test places, and
      # --uninstall-cleanup removing its part for all users in test places) skip quietly
      # elsewhere, so each must have printed its own line here. The canary under
      # HKEY_LOCAL_MACHINE\Software\Classes runs unelevated too, but prints its line only where it
      # ran elevated and found real writes, so that line must be here as well.
      - name: Check the elevated test paths
        if: env.PDFT_ARCH == 'x64'
        run: |
          set "BIN=out\build\%PRESET%\bin"
          set "LOG=out\build\%PRESET%\Testing\Temporary\LastTest.log"
          "%BIN%\pdft-run-medium.exe" --check-token
          "%BIN%\pdft-run-medium.exe" -- "%BIN%\pdft-run-medium.exe" --check-token
          findstr /c:"pdft: relaunched at Medium integrity" "%LOG%" || (echo ::error::The handler tests did not relaunch at Medium integrity& exit /b 1)
          findstr /c:"ok: the handler refuses to render in an elevated process" "%LOG%" || (echo ::error::handler.refuses_elevated did not run elevated& exit /b 1)
          findstr /c:"ok: the handler refuses to render at Medium integrity with Administrators enabled" "%LOG%" || (echo ::error::handler.refuses_elevated did not check a Medium token with Administrators enabled& exit /b 1)
          findstr /l /c:"--status --no-live-test -> exit 0x" "%LOG%" || (echo ::error::gate.planting did not run --status elevated& exit /b 1)
          findstr /l /c:"[ tasks ] folder made as" "%LOG%" || (echo ::error::EnsureTaskFolder did not make the protected task folder elevated& exit /b 1)
          findstr /l /c:"[ tasks ] repaired a folder a standard user made:" "%LOG%" || (echo ::error::EnsureTaskFolder did not repair a folder a standard user made& exit /b 1)
          findstr /l /c:"[ tasks ] standard user: apply-task hr=0x00000000 elevated=0" "%LOG%" || (echo ::error::A standard user did not register a task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] someone else's task in the folder skipped: yes" "%LOG%" || (echo ::error::ReadTask did not skip another account's task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] every user's task removed with the folder: yes" "%LOG%" || (echo ::error::DeleteTaskFolderAllUsers did not remove a standard user's task with the folder& exit /b 1)
          findstr /l /c:"[ tasks ] another account's task in the folder kept, the fallback name used: yes" "%LOG%" || (echo ::error::ApplyTaskOptions registered over or deleted another account's task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] another account's task under the fallback name kept, the folder used: yes" "%LOG%" || (echo ::error::ApplyTaskOptions deleted another account's task under the fallback name& exit /b 1)
          findstr /l /c:"[ tasks ] standard user with both names taken: apply-task hr=0x800402E8 elevated=0" "%LOG%" || (echo ::error::A standard user's registration did not answer that another account's tasks hold both names& exit /b 1)
          findstr /l /c:"--checks default (elevated) -> exit 8" "%LOG%" || (echo ::error::--checks was not refused elevated& exit /b 1)
          findstr /l /c:"--checks default (not installed) -> exit " "%LOG%" || (echo ::error::--checks did not run at Medium integrity where nothing is installed& exit /b 1)
          findstr /l /c:" --setup-user (elevated) -> exit 8" "%LOG%" || (echo ::error::--setup-user was not refused elevated& exit /b 1)
          findstr /l /c:" --migrate-v1 (elevated) -> exit 8" "%LOG%" || (echo ::error::--migrate-v1 was not refused elevated& exit /b 1)
          findstr /l /c:" --install (elevated) -> exit 8" "%LOG%" || (echo ::error::--install was not refused elevated& exit /b 1)
          findstr /l /c:" --uninstall --yes (elevated) -> exit 8" "%LOG%" || (echo ::error::--uninstall was not refused elevated& exit /b 1)
          findstr /l /c:" --diagnostics --out (elevated) -> exit 8" "%LOG%" || (echo ::error::--diagnostics --out was not refused elevated& exit /b 1)
          findstr /l /c:"[ setup ] --setup-machine in test places (elevated) -> exit " "%LOG%" || (echo ::error::--setup-machine did not run elevated in test places& exit /b 1)
          findstr /l /c:"[ install ] --uninstall-cleanup machine part in test places (elevated): removed" "%LOG%" || (echo ::error::--uninstall-cleanup did not remove the part for all users elevated in test places& exit /b 1)
          findstr /l /c:"[ context ] machine canary (elevated): real" "%LOG%" || (echo ::error::The canary under HKEY_LOCAL_MACHINE did not show real writes elevated& exit /b 1)

      # The commands that would rebuild the thumbnail cache, or refresh thumbnails, if they were
      # not refused elevated (--uninstall --rebuild-thumbnails, --refresh --full and --refresh
      # --folder) are started only on a runner GitHub hosts, which is thrown away after the job;
      # elsewhere the tests say they did not start them. So their refusals are checked only there.
      - name: Check the elevated rebuild and refresh refusals (runners GitHub hosts only)
        if: env.PDFT_ARCH == 'x64' && runner.environment == 'github-hosted'
        run: |
          set "LOG=out\build\%PRESET%\Testing\Temporary\LastTest.log"
          findstr /l /c:" --uninstall --yes --rebuild-thumbnails (elevated) -> exit 8" "%LOG%" || (echo ::error::--uninstall --rebuild-thumbnails was not refused elevated& exit /b 1)
          findstr /l /c:" --refresh --full --yes (elevated) -> exit 8" "%LOG%" || (echo ::error::--refresh --full was not refused elevated& exit /b 1)
          findstr /l /c:" --refresh --folder (elevated) -> exit 8" "%LOG%" || (echo ::error::--refresh --folder was not refused elevated& exit /b 1)

      # CTest counts a test case that GoogleTest skipped as passed: list every skipped test, with
      # its reason, in the log and in one notice on the run's summary page.
      - name: List the skipped tests
        shell: powershell
        env:
          TESTLOGS: out\build\${{ matrix.preset }}\Testing\Temporary
        run: |
          # CTest's own skips (exit 77) are in the JUnit file. GoogleTest's are in the full log
          # (the JUnit file keeps only 1 KB of a passed test's output): "<file>(<line>): Skipped",
          # the reason on the next line (may be empty), then "[  SKIPPED ] <case> (<n> ms)".
          $found = @()
          $junit = [xml](Get-Content -LiteralPath "$env:TESTLOGS\junit.xml" -Raw -Encoding UTF8)
          foreach ($case in $junit.SelectNodes('//testcase[skipped]')) {
            $found += "$($case.GetAttribute('name')): skipped by CTest ($($case.SelectSingleNode('skipped').GetAttribute('message')))"
          }
          $test = ''
          $reason = ''
          $afterSkip = $false
          foreach ($line in Get-Content -LiteralPath "$env:TESTLOGS\LastTest.log" -Encoding UTF8) {
            if ($afterSkip) { $reason = $line; $afterSkip = $false }
            elseif ($line -match '^\d+/\d+ Test: (.+)$') { $test = $Matches[1] }
            elseif ($line -match '^\[  SKIPPED \] (\S+) \(\d+ ms\)$') {
              $found += "${test}: $($Matches[1])" + $(if ($reason) { ": $reason" } else { '' })
              $reason = ''
            }
            elseif ($line -match '\): Skipped$') { $afterSkip = $true }
          }
          if (-not $found) { 'No test skipped.'; exit 0 }
          $found | ForEach-Object { "skipped: $_" }
          # Workflow commands need %, CR and LF escaped.
          $title = if ($found.Count -eq 1) { '1 skipped test' } else { "$($found.Count) skipped tests" }
          '::notice title=' + $title + '::' + ($found -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')

      # The real settings window, driven from outside: only x64, because the ARM64 runners have no
      # desktop the shell can reach. It changes nothing yet that outlives the runner. After the
      # steps above, which read the main test run's logs: this ctest run replaces them.
      - name: Drive the settings window (runners GitHub hosts only)
        if: ${{ matrix.preset == 'ci-x64' && runner.environment == 'github-hosted' }}
        timeout-minutes: 10
        env:
          PDFT_GUI_TESTS: '1'
          PDFT_GUI_SHOTS: ${{ github.workspace }}\out\window-shots
        run: ctest --test-dir out\build\ci-x64 -L gui -V --no-tests=error

      - name: Upload the pictures of the settings window
        if: ${{ !cancelled() && matrix.preset == 'ci-x64' && runner.environment == 'github-hosted' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-shots
          path: out/window-shots/
          if-no-files-found: warn
          retention-days: 7

      - name: Stage runtime, symbols and tests
        if: startsWith(matrix.preset, 'ci-')
        run: |
          set "INFO=out\stage\BUILDINFO.txt"
          if not exist out\stage mkdir out\stage
          copy /y "out\build\%PRESET%\buildinfo.txt" "%INFO%" >nul || exit /b 1
          >> "%INFO%" echo(commit: %GITHUB_SHA%
          >> "%INFO%" echo(runner_image: %ImageOS% %ImageVersion%
          for %%C in (runtime symbols tests) do (
            cmake --install "out\build\%PRESET%" --prefix "out\stage\%%C" --component %%C || exit /b 1
            copy /y "%INFO%" "out\stage\%%C\BUILDINFO.txt" >nul || exit /b 1
          )
          type "%INFO%"

      - name: Upload PdfThumbnails-${{ env.PDFT_ARCH }}-unsigned
        if: startsWith(matrix.preset, 'ci-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfThumbnails-${{ env.PDFT_ARCH }}-unsigned
          path: out/stage/runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Upload symbols-${{ env.PDFT_ARCH }}
        if: startsWith(matrix.preset, 'ci-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ env.PDFT_ARCH }}
          path: out/stage/symbols/
          if-no-files-found: error
          retention-days: 14

      - name: Upload tests-${{ env.PDFT_ARCH }}
        if: startsWith(matrix.preset, 'ci-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ env.PDFT_ARCH }}
          path: out/stage/tests/
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/buildinfo.txt
            out/build/${{ matrix.preset }}/Testing/Temporary/
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  # Uses only build (ci-arm64)'s tests-arm64 artifact: !cancelled() lets it run when another
  # build leg (x64-debug, ci-x64) failed, and the download fails when ci-arm64 made no artifact.
  test-arm64:
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || inputs.called) && vars.PDFT_ARM64_TESTS != 'off' }}
    runs-on: ${{ vars.PDFT_ARM64_RUNNER || 'windows-11-arm' }}
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Download tests-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-arm64
          path: t

      - name: Runner image, UAC and token
        run: |
          echo Runner image: %ImageOS% %ImageVersion%
          type t\BUILDINFO.txt
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin
          whoami /groups | findstr /i /c:"Mandatory Label" /c:"S-1-5-32-544"
          exit /b 0

      - name: Unit, handler and integration tests (native ARM64)
        run: ctest --test-dir t -L "unit|handler|integration" --output-on-failure --output-junit Testing/Temporary/junit.xml --no-tests=error --timeout 900

      - name: Check the elevated test paths
        run: |
          t\pdft-run-medium.exe --check-token
          t\pdft-run-medium.exe -- t\pdft-run-medium.exe --check-token
          findstr /c:"pdft: relaunched at Medium integrity" t\Testing\Temporary\LastTest.log || (echo ::error::The handler tests did not relaunch at Medium integrity& exit /b 1)
          findstr /c:"ok: the handler refuses to render in an elevated process" t\Testing\Temporary\LastTest.log || (echo ::error::handler.refuses_elevated did not run elevated& exit /b 1)
          findstr /c:"ok: the handler refuses to render at Medium integrity with Administrators enabled" t\Testing\Temporary\LastTest.log || (echo ::error::handler.refuses_elevated did not check a Medium token with Administrators enabled& exit /b 1)
          findstr /l /c:"[ tasks ] folder made as" t\Testing\Temporary\LastTest.log || (echo ::error::EnsureTaskFolder did not make the protected task folder elevated& exit /b 1)
          findstr /l /c:"[ tasks ] repaired a folder a standard user made:" t\Testing\Temporary\LastTest.log || (echo ::error::EnsureTaskFolder did not repair a folder a standard user made& exit /b 1)
          findstr /l /c:"[ tasks ] standard user: apply-task hr=0x00000000 elevated=0" t\Testing\Temporary\LastTest.log || (echo ::error::A standard user did not register a task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] someone else's task in the folder skipped: yes" t\Testing\Temporary\LastTest.log || (echo ::error::ReadTask did not skip another account's task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] every user's task removed with the folder: yes" t\Testing\Temporary\LastTest.log || (echo ::error::DeleteTaskFolderAllUsers did not remove a standard user's task with the folder& exit /b 1)
          findstr /l /c:"[ tasks ] another account's task in the folder kept, the fallback name used: yes" t\Testing\Temporary\LastTest.log || (echo ::error::ApplyTaskOptions registered over or deleted another account's task in the protected folder& exit /b 1)
          findstr /l /c:"[ tasks ] another account's task under the fallback name kept, the folder used: yes" t\Testing\Temporary\LastTest.log || (echo ::error::ApplyTaskOptions deleted another account's task under the fallback name& exit /b 1)
          findstr /l /c:"[ tasks ] standard user with both names taken: apply-task hr=0x800402E8 elevated=0" t\Testing\Temporary\LastTest.log || (echo ::error::A standard user's registration did not answer that another account's tasks hold both names& exit /b 1)
          findstr /l /c:"--checks default (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--checks was not refused elevated& exit /b 1)
          findstr /l /c:"--checks default (not installed) -> exit " t\Testing\Temporary\LastTest.log || (echo ::error::--checks did not run at Medium integrity where nothing is installed& exit /b 1)
          findstr /l /c:" --setup-user (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--setup-user was not refused elevated& exit /b 1)
          findstr /l /c:" --migrate-v1 (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--migrate-v1 was not refused elevated& exit /b 1)
          findstr /l /c:" --install (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--install was not refused elevated& exit /b 1)
          findstr /l /c:" --uninstall --yes (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--uninstall was not refused elevated& exit /b 1)
          findstr /l /c:" --diagnostics --out (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--diagnostics --out was not refused elevated& exit /b 1)
          findstr /l /c:"[ setup ] --setup-machine in test places (elevated) -> exit " t\Testing\Temporary\LastTest.log || (echo ::error::--setup-machine did not run elevated in test places& exit /b 1)
          findstr /l /c:"[ install ] --uninstall-cleanup machine part in test places (elevated): removed" t\Testing\Temporary\LastTest.log || (echo ::error::--uninstall-cleanup did not remove the part for all users elevated in test places& exit /b 1)
          findstr /l /c:"[ context ] machine canary (elevated): real" t\Testing\Temporary\LastTest.log || (echo ::error::The canary under HKEY_LOCAL_MACHINE did not show real writes elevated& exit /b 1)

      # As in build: only on a runner GitHub hosts.
      - name: Check the elevated rebuild and refresh refusals (runners GitHub hosts only)
        if: runner.environment == 'github-hosted'
        run: |
          findstr /l /c:" --uninstall --yes --rebuild-thumbnails (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--uninstall --rebuild-thumbnails was not refused elevated& exit /b 1)
          findstr /l /c:" --refresh --full --yes (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--refresh --full was not refused elevated& exit /b 1)
          findstr /l /c:" --refresh --folder (elevated) -> exit 8" t\Testing\Temporary\LastTest.log || (echo ::error::--refresh --folder was not refused elevated& exit /b 1)

      # The same list as in build: see there.
      - name: List the skipped tests
        shell: powershell
        env:
          TESTLOGS: t\Testing\Temporary
        run: |
          # CTest's own skips (exit 77) are in the JUnit file. GoogleTest's are in the full log
          # (the JUnit file keeps only 1 KB of a passed test's output): "<file>(<line>): Skipped",
          # the reason on the next line (may be empty), then "[  SKIPPED ] <case> (<n> ms)".
          $found = @()
          $junit = [xml](Get-Content -LiteralPath "$env:TESTLOGS\junit.xml" -Raw -Encoding UTF8)
          foreach ($case in $junit.SelectNodes('//testcase[skipped]')) {
            $found += "$($case.GetAttribute('name')): skipped by CTest ($($case.SelectSingleNode('skipped').GetAttribute('message')))"
          }
          $test = ''
          $reason = ''
          $afterSkip = $false
          foreach ($line in Get-Content -LiteralPath "$env:TESTLOGS\LastTest.log" -Encoding UTF8) {
            if ($afterSkip) { $reason = $line; $afterSkip = $false }
            elseif ($line -match '^\d+/\d+ Test: (.+)$') { $test = $Matches[1] }
            elseif ($line -match '^\[  SKIPPED \] (\S+) \(\d+ ms\)$') {
              $found += "${test}: $($Matches[1])" + $(if ($reason) { ": $reason" } else { '' })
              $reason = ''
            }
            elseif ($line -match '\): Skipped$') { $afterSkip = $true }
          }
          if (-not $found) { 'No test skipped.'; exit 0 }
          $found | ForEach-Object { "skipped: $_" }
          # Workflow commands need %, CR and LF escaped.
          $title = if ($found.Count -eq 1) { '1 skipped test' } else { "$($found.Count) skipped tests" }
          '::notice title=' + $title + '::' + ($found -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-test-arm64
          path: t/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # Informational (continue-on-error: it never fails the run): installs for real on the runner,
  # which is thrown away afterwards. It builds nothing: the system tests come in build
  # (ci-x64)'s x64 test bundle, and they install from its staged runtime artifact (cmake
  # --install with the runtime component), exactly what ships. The runner is elevated with UAC
  # on (EnableLUA=1) and ConsentPromptBehaviorAdmin=0, so the tests' unelevated commands (Medium
  # integrity, a standard user's token) have their administrator steps done through UAC without
  # a prompt. The program refuses to run without PDFT_SYSTEM_TESTS=1, unelevated, or where 1.x
  # or 2.x is installed. A standard account the tests make runs the bundle's integration tests'
  # task tests, so the bundle's pdft_integration_tests is used here too, and the test account runs
  # the bundle's thumbtest. After the tests, on a runner GitHub hosts only, the last steps look at
  # the runner's own File Explorer and thumbnail cache and rebuild that cache for real.
  system-x64:
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || inputs.called) }}
    runs-on: ${{ vars.PDFT_WIN_X64_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    continue-on-error: true
    permissions: {}
    steps:
      - name: Download tests-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-x64
          path: t

      - name: Download PdfThumbnails-x64-unsigned
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfThumbnails-x64-unsigned
          path: runtime

      - name: Runner image, UAC and token
        run: |
          echo Runner image: %ImageOS% %ImageVersion%
          type runtime\BUILDINFO.txt
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin
          rem A value that is not there has its default (FilterAdministratorToken 0: the built-in
          rem Administrator runs without Admin Approval Mode).
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v FilterAdministratorToken
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorUser
          whoami /groups | findstr /i /c:"Mandatory Label" /c:"S-1-5-32-544"
          t\pdft-run-medium.exe -- t\pdft-run-medium.exe --check-token
          rem The tests run the user's commands as an account of their own: CreateProcessWithTokenW
          rem needs SeImpersonatePrivilege and the Secondary Logon service; the session decides
          rem where UAC puts the elevated step.
          whoami /priv | findstr /i /c:"SeImpersonatePrivilege" /c:"SeAssignPrimaryTokenPrivilege"
          sc qc seclogon | findstr /i /c:"START_TYPE"
          sc query seclogon | findstr /i /c:"STATE"
          echo Session: %SESSIONNAME%
          rem The tests' second opt-in: a runner GitHub hosts.
          echo GITHUB_ACTIONS=%GITHUB_ACTIONS% RUNNER_ENVIRONMENT=%RUNNER_ENVIRONMENT%
          exit /b 0

      # Every command and its output is in the log, each line of the tests' own starting with
      # "[ system ]".
      - name: System tests (install, use, 1.1 replaced, thumbnail refresh, uninstall)
        env:
          PDFT_SYSTEM_TESTS: "1"
        run: |
          set "PDFT_SYSTEM_RUNTIME=%GITHUB_WORKSPACE%\runtime"
          ctest --test-dir t -L system -V --output-junit Testing/Temporary/junit.xml --no-tests=error --timeout 2400

      # A skipped program (exit 77) counts as passed in CTest: the tests must have reached their
      # end. The elevated steps report back through a pipe of the unelevated process, which
      # accepts only its own child: this shows whether UAC makes the asking process the parent.
      # The user's commands run as a local administrator account the tests make for the run,
      # with the limited token of its interactive logon, so each administrator step must go
      # through UAC into its linked token; when it does not, the tests say so and stop. Its
      # programs run in the runner's session, whose named objects the tests let it use; when
      # that cannot be granted, they say so and stop too. A second account, a standard user's
      # (not in Administrators), must have had a standard user's token; the integration tests'
      # task tests run as it must have come out as a standard user's (every TaskWriting test
      # passed, but the one that needs a Windows session of the account's own, and every
      # TaskFolderElevated test skipped as needing elevation) and left nothing behind, in Task
      # Scheduler or of the product; and its own --setup-user after the install for all users
      # must have put its check task into the protected task folder an administrator made. The
      # test account's --refresh --full --yes must have been refused while File Explorer was the
      # runner's, and File Explorer's process must have stayed the same (where the test finds no
      # File Explorer of another account's, it says so and does not run the command, and this
      # fails). The refresh experiment's verdict and the cache after the uninstall are among the
      # [ system ] lines, informational.
      - name: Check that the system tests ran
        if: ${{ !cancelled() }}
        run: |
          set "LOG=t\Testing\Temporary\LastTest.log"
          findstr /l /c:"[ system ]" "%LOG%"
          findstr /l /c:"[ system ] UAC did not elevate" "%LOG%" >nul && (echo ::error::UAC did not elevate the test account's administrator step on this runner; the [ system ] lines show the step's token& exit /b 1)
          findstr /l /c:"[ system ] test account's token: elevated no, elevation type 3 (limited)" "%LOG%" >nul || (echo ::error::The tests did not get a test account with a limited token: see the [ system ] lines& exit /b 1)
          findstr /l /c:"[ system ] the tests stop: the test account may not use this session's named objects" "%LOG%" >nul && (echo ::error::The test account could not be let into this session's named objects, so the app's commands could not make their lock as it; the [ system ] lines show the directory's permissions and which step was refused& exit /b 1)
          findstr /l /c:"[ system ] standard account's token: elevated no, elevation type 1 (default)" "%LOG%" >nul || (echo ::error::The tests did not get a standard account with a standard user's token: see the [ system ] lines& exit /b 1)
          findstr /l /c:"[ system ] task tests as the standard account as expected: yes" "%LOG%" >nul || (echo ::error::The task tests did not come out as a standard user's when run as the standard account, or left something behind; the [ system ] lines say what& exit /b 1)
          findstr /l /c:"[ system ] the standard account's --setup-user put its check task in the protected task folder: yes" "%LOG%" >nul || (echo ::error::A standard user's --setup-user did not put its check task in the protected task folder the install made& exit /b 1)
          findstr /l /c:"[ system ] this session's named objects: permissions put back no" "%LOG%" >nul && echo ::warning::A test account's entry could not be taken out of this session's named objects' permissions again; the [ system ] lines show why
          findstr /l /c:"[ system ] nothing left" "%LOG%" >nul || (echo ::error::The system tests did not run to the end& exit /b 1)
          findstr /l /c:"[ system ] machine-install reported through the asking process's pipe: yes" "%LOG%" >nul || (echo ::error::The elevated step's report did not come back through the asking process's pipe& exit /b 1)
          findstr /l /c:"[ system ] machine-install got administrator rights through UAC: yes" "%LOG%" >nul || (echo ::error::The step for all users did not get administrator rights through UAC& exit /b 1)
          findstr /l /c:"[ system ] --refresh --full --yes as the test account -> exit 8, File Explorer's process unchanged: yes" "%LOG%" >nul || (echo ::error::The test account's --refresh --full was not refused for the runner's File Explorer, or File Explorer's process changed; the [ system ] lines say what& exit /b 1)

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-system-x64
          path: t/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

      # Only on a runner GitHub hosts, on the runner's own account through pdft-run-medium (Medium
      # integrity, a standard user's rights), after the system tests (which must find nothing of
      # the product on this account first): what the thumbnail-cache rebuild would find here (the
      # shell's account and integrity, File Explorer's processes, AutoRestartShell, the folder
      # windows, the cache files and, by image name, the programs that hold them), and the
      # integration tests' probes of the same (disabled elsewhere). It ends nothing and deletes
      # nothing, but one probe runs the Explorer test: a probe PDF in %TEMP% made into a thumbnail
      # that is not stored. Counts and image names only.
      - name: File Explorer and the thumbnail cache on this runner (runners GitHub hosts only)
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        timeout-minutes: 5
        run: |
          rem The system tests' own opt-in, checked again here: never on a runner of your own.
          if /i not "%GITHUB_ACTIONS%"=="true" (echo Not run: this is not GitHub Actions.& exit /b 0)
          if /i not "%RUNNER_ENVIRONMENT%"=="github-hosted" (echo Not run: this is not a runner GitHub hosts.& exit /b 0)
          t\pdft-run-medium.exe -- t\thumbtest.exe shellinfo --windows --holders
          t\pdft-run-medium.exe -- t\pdft_integration_tests.exe --gtest_also_run_disabled_tests --gtest_filter=RefreshProbe.* --gtest_color=no
          exit /b 0

      # The settings window on this runner's own account with the product installed for that
      # account, after the system tests, which must find nothing of the product.
      - name: Drive the settings window with the product installed (runners GitHub hosts only)
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        timeout-minutes: 10
        env:
          PDFT_GUI_TESTS: '1'
          PDFT_GUI_INSTALLED: '1'
          PDFT_GUI_SHOTS: ${{ github.workspace }}\window-shots
        run: |
          rem --install refuses a folder other accounts can change, as a runner's work drive is.
          rem The profile is only this account's.
          xcopy /e /i /q runtime "%USERPROFILE%\pdft-gui-runtime" >nul
          t\pdft-run-medium.exe -- "%USERPROFILE%\pdft-gui-runtime\PdfThumbnailsCli.exe" --install --user
          echo --install --user: exit %ERRORLEVEL%
          ctest --test-dir t -L gui -V --no-tests=error

      - name: Upload the pictures of the settings window
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-shots-installed
          path: window-shots/
          if-no-files-found: warn
          retention-days: 7

      # Informational, and only on a runner GitHub hosts (the runner is thrown away afterwards):
      # the thumbnail-cache rebuild for real, as --refresh --full --yes on the runner's own account
      # through pdft-run-medium, with one folder window open. It ends the File Explorer and
      # thumbnail processes that hold the runner's thumbnail cache, where this token may end them,
      # deletes the cache, waits for File Explorer to come back and opens the window again. Where
      # the runner's File Explorer runs elevated, it may end nothing, and File Explorer's pid
      # stays. The rebuild's log lines and the state afterwards are printed, nothing is judged. The
      # last step, after the logs' upload, so nothing after it needs File Explorer.
      - name: Rebuild the runner's thumbnail cache (runners GitHub hosts only)
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        timeout-minutes: 5
        run: |
          rem The system tests' own opt-in, checked again here: never on a runner of your own.
          if /i not "%GITHUB_ACTIONS%"=="true" (echo Not run: this is not GitHub Actions.& exit /b 0)
          if /i not "%RUNNER_ENVIRONMENT%"=="github-hosted" (echo Not run: this is not a runner GitHub hosts.& exit /b 0)
          set "WINDOW=%RUNNER_TEMP%\pdft-rebuild-window"
          set "LOG=%LOCALAPPDATA%\PdfThumbnails\Logs\PdfThumbnails.log"
          mkdir "%WINDOW%" || exit /b 0
          start "" explorer.exe "%WINDOW%"
          powershell -NoProfile -Command "Start-Sleep -Seconds 5"
          t\pdft-run-medium.exe -- t\thumbtest.exe shellinfo --windows
          t\pdft-run-medium.exe -- runtime\PdfThumbnailsCli.exe --refresh --full --yes
          echo --refresh --full --yes at Medium integrity: exit %ERRORLEVEL%
          findstr /l /c:" refresh full " "%LOG%"
          t\pdft-run-medium.exe -- t\thumbtest.exe shellinfo --windows --holders
          exit /b 0