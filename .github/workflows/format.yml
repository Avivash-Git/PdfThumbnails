# Source hygiene on every push and pull request (Linux: cheap minutes):
#   - clang-format 23.1.3 (pinned by hash in .github/tools/requirements-format.txt) finds nothing
#     to change in the C++ sources (.clang-format);
#   - no tracked file contains a personal path, a user SID, a PC name or a mail address, so
#     test fixtures and logs cannot leak them into the public history.
# Locally: git ls-files "*.cpp" "*.h" "*.inc" | xargs clang-format --dry-run --Werror

name: format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ubuntu's Python is "externally managed" (PEP 668): install into a virtual environment.
      - name: Install clang-format (pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/fmt"
          "$RUNNER_TEMP/fmt/bin/pip" install --disable-pip-version-check --require-hashes \
            --only-binary=:all: --no-deps -r .github/tools/requirements-format.txt
          "$RUNNER_TEMP/fmt/bin/clang-format" --version

      - name: clang-format --dry-run --Werror
        run: |
          git ls-files -z -- '*.cpp' '*.h' '*.inc' |
            xargs -0 --no-run-if-empty "$RUNNER_TEMP/fmt/bin/clang-format" --dry-run --Werror

      # Generic patterns only, written so that they do not match themselves. Placeholders such as
      # C:\Users\<name> or %USERPROFILE% are fine.
      - name: No personal paths, SIDs, PC names or mail addresses
        run: |
          found=0
          check() {   # git grep exits 0 on a match, 1 on none, anything else on an error
            local rc=0
            git grep -n -I -E "$@" || rc=$?
            if [ "$rc" -eq 0 ]; then found=1; elif [ "$rc" -ne 1 ]; then exit "$rc"; fi
          }
          check -i -e '[a-z]:[\\/]+users[\\/]+[^<%$\\/ ]' -e '/home/[a-z][a-z0-9_-]*/' \
                   -e 'claude-dat[a]' -e 'scratch-workspace[s]' \
                   -e '[a-z0-9._%+-]+@(gmai[l]|outlook|hotmail|live|yahoo|icloud|proton)\.[a-z]+'
          check -e 'S-1-5-21-[0-9]+-[0-9]+-[0-9]+' -e '\bDESKTO[P]-[A-Z0-9]{7}\b'
          if [ "$found" -ne 0 ]; then
            echo "::error::Tracked files contain a personal path, SID, PC name or mail address (above)."
            exit 1
          fi
